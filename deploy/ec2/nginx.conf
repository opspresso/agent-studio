# /etc/nginx/conf.d/agent-studio.conf
# HTTP server block; certbot --nginx rewrites it for HTTPS after the
# Route53 A record points the domain at the EIP.
#
# The SSE settings are load-bearing: agent runs stream for minutes, and
# default proxy buffering/timeouts silently kill them.

server {
    listen 80;
    server_name __DOMAIN__;

    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # SSE / long-running agent streams
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location /api/health {
        proxy_pass http://127.0.0.1:3000/api/health;
        access_log off;
    }
}
