# Agent Studio on Kubernetes, for an installation that owns its cluster.
#
# Three things have to exist: the app, a PostgreSQL with pgvector, and — for
# artifacts — an S3-compatible store. The chart can bundle the last two
# (`postgres.enabled`, `minio.enabled`: a StatefulSet each, with a PVC) for a
# single-cluster install, or point at ones the organisation already runs.
# Secrets are one Kubernetes Secret; an existing one can be named instead.

image:
  repository: ghcr.io/opspresso/agent-studio
  tag: ""            # defaults to the chart's appVersion
  pullPolicy: IfNotPresent
imagePullSecrets: []

replicaCount: 1

# What the app reads from its environment. Anything not a secret goes here;
# see docs/CONFIGURATION.md for every variable. The database and object-store
# variables are filled in by the chart when the bundled services are on.
config:
  STAGE: prod
  ADMIN_EMAILS: ""
  ALLOWED_EMAIL_DOMAINS: ""
  PUBLIC_BASE_URL: ""           # https://studio.example.com — also BETTER_AUTH_URL
  LLM_BASE_URL: ""              # the default OpenAI-compatible channel
  UNKNOWN_MODEL_POLICY: allow
  # Sign-in: an OIDC issuer (client id/secret in secrets), and/or password
  # sign-in with a bootstrap administrator (password in secrets).
  OIDC_ISSUER: ""
  OIDC_DISPLAY_NAME: SSO
  AUTH_PASSWORD: "true"
  BOOTSTRAP_ADMIN_EMAIL: ""
  # Artifacts through the app, so the object store needs no public address.
  ARTIFACT_ACCESS_MODE: proxied
  S3_BUCKET_NAME: agent-studio
  # `none` for a network that cannot reach the published catalog; the admin
  # uploads it on /models instead.
  MODELS_CATALOG_URL: https://models.opspresso.com/models.json
  # The capability catalog needs an embedding model the channel serves.
  CATALOG_ENABLED: "false"
  EMBEDDING_PROVIDER: openai
  EMBEDDING_MODEL: text-embedding-3-small
  EMBEDDING_DIM: "1024"
  # DNS suffixes the SSRF guard lets MCP entries and the FetchUrl builtin
  # reach inside the network. Empty keeps the guard exactly as it is.
  MCP_INTERNAL_HOST_SUFFIXES: ""
  URL_FETCH_INTERNAL_HOST_SUFFIXES: ""
  MAX_RUN_DURATION_MS: "600000"
  # The proxies in front of the app (the ingress controller's pod CIDR), so
  # rate limiting sees client addresses.
  TRUSTED_PROXY_CIDRS: ""
  # Extra variables, verbatim.
  extra: {}

# Secrets, as plain values the chart base64-encodes into one Secret — or
# `existingSecret`, a Secret the operator created with the same keys. Values
# left empty are omitted.
secrets:
  existingSecret: ""
  AES_ENCRYPTION_KEY: ""        # openssl rand -base64 32 — never rotate casually
  BETTER_AUTH_SECRET: ""        # openssl rand -base64 32
  LLM_API_KEY: ""
  OIDC_CLIENT_ID: ""
  OIDC_CLIENT_SECRET: ""
  BOOTSTRAP_ADMIN_PASSWORD: ""
  SCHEDULE_SCAN_TOKEN: ""       # openssl rand -hex 32 — the ticker's credential
  A2A_API_KEY: ""
  GITHUB_TOKEN: ""
  # When the bundled services are off, the external ones' credentials:
  DATABASE_URL: ""              # postgres://user:pass@host:5432/db
  AWS_ACCESS_KEY_ID: ""
  AWS_SECRET_ACCESS_KEY: ""
  extra: {}

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ""
  annotations: {}
  host: studio.example.com
  tls:
    enabled: false
    secretName: ""

resources:
  requests:
    cpu: 200m
    memory: 512Mi
  limits:
    memory: 1536Mi

# At least MAX_RUN_DURATION_MS: the app drains in-flight streams on SIGTERM.
terminationGracePeriodSeconds: 660

podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}

# The scheduler tick: schedules, the plugins sync check, the retention sweep
# every minute; the catalog reindex hourly. Off means nothing ticks.
ticker:
  enabled: true
  image: curlimages/curl:8.11.1
  schedule: "* * * * *"
  reindexSchedule: "12 * * * *"

# A bundled PostgreSQL with pgvector — one StatefulSet, one PVC. For a
# production install with an existing database, disable this and set
# `secrets.DATABASE_URL`.
postgres:
  enabled: true
  image: pgvector/pgvector:pg17
  database: agent_studio
  username: agent_studio
  # Required. Set once (openssl rand -hex 24) and keep it: initdb writes it
  # into the volume at first start, and a changed value locks the app out.
  # Not generated by the chart — a generated value would differ on every
  # GitOps render.
  password: ""
  storage:
    className: ""
    size: 20Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi

# A bundled MinIO for artifacts — one StatefulSet, one PVC. Disable for an
# existing S3-compatible store and set `config.extra.S3_ENDPOINT` plus the
# access key in secrets.
minio:
  enabled: true
  image: minio/minio:RELEASE.2025-09-07T16-13-09Z
  mcImage: minio/mc:RELEASE.2025-08-13T08-35-41Z
  rootUser: agent-studio
  rootPassword: ""              # required (openssl rand -hex 24); same reasoning as postgres.password
  storage:
    className: ""
    size: 50Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi
