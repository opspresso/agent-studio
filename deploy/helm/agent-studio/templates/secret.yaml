{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "agent-studio.fullname" . }}-secrets
  labels:
    {{- include "agent-studio.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $key, $value := omit .Values.secrets "existingSecret" "extra" }}
  {{- if ne (toString $value) "" }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
  {{- end }}
  {{- range $key, $value := .Values.secrets.extra }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}
{{- if .Values.postgres.enabled }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "agent-studio.fullname" . }}-postgres
  labels:
    {{- include "agent-studio.labels" . | nindent 4 }}
  annotations:
    # Kept across upgrades by the `keep` helper: a regenerated password would
    # lock the app out of its own data.
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ include "agent-studio.postgresPassword" . | quote }}
{{- end }}
{{- if .Values.minio.enabled }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "agent-studio.fullname" . }}-minio
  labels:
    {{- include "agent-studio.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  MINIO_ROOT_USER: {{ .Values.minio.rootUser | quote }}
  MINIO_ROOT_PASSWORD: {{ include "agent-studio.minioPassword" . | quote }}
{{- end }}
