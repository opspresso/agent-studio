apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "agent-studio.fullname" . }}
  labels:
    {{- include "agent-studio.labels" . | nindent 4 }}
{{- /*
Collected into one dict before anything is written: `extra` may name a key
`config` already carries, and emitting both would put the same mapping key in
the document twice — which yamllint, kubeconform and Argo CD reject outright
and every other reader resolves silently to whichever came last. Collected,
`extra` simply overrides, which is what "verbatim" was meant to mean.
*/}}
{{- $data := dict }}
{{- range $key, $value := omit .Values.config "extra" }}
{{- if ne (toString $value) "" }}
{{- $_ := set $data $key (toString $value) }}
{{- end }}
{{- end }}
{{- if .Values.config.PUBLIC_BASE_URL }}
{{- $_ := set $data "BETTER_AUTH_URL" (toString .Values.config.PUBLIC_BASE_URL) }}
{{- end }}
{{- range $key, $value := .Values.config.extra }}
{{- $_ := set $data $key (toString $value) }}
{{- end }}
data:
  {{- range $key, $value := $data }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
