{{- if .Values.minio.enabled }}
# A bundled MinIO for artifacts: one replica, one volume, plus a Job that
# creates the bucket. With ARTIFACT_ACCESS_MODE=proxied the app is its only
# client, so it is never exposed.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "agent-studio.fullname" . }}-minio
  labels:
    {{- include "agent-studio.labels" . | nindent 4 }}
    app.kubernetes.io/component: minio
spec:
  clusterIP: None
  ports:
    - name: s3
      port: 9000
  selector:
    {{- include "agent-studio.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: minio
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "agent-studio.fullname" . }}-minio
  labels:
    {{- include "agent-studio.labels" . | nindent 4 }}
    app.kubernetes.io/component: minio
spec:
  serviceName: {{ include "agent-studio.fullname" . }}-minio
  replicas: 1
  selector:
    matchLabels:
      {{- include "agent-studio.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: minio
  template:
    metadata:
      labels:
        {{- include "agent-studio.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: minio
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - name: minio
          image: {{ .Values.minio.image }}
          args: ["server", "/data"]
          ports:
            - name: s3
              containerPort: 9000
          envFrom:
            - secretRef:
                name: {{ include "agent-studio.fullname" . }}-minio
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: s3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: s3
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            {{- toYaml .Values.minio.resources | nindent 12 }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with .Values.minio.storage.className }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.minio.storage.size }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "agent-studio.fullname" . }}-minio-init
  labels:
    {{- include "agent-studio.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 6
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: mc
          image: {{ .Values.minio.mcImage }}
          envFrom:
            - secretRef:
                name: {{ include "agent-studio.fullname" . }}-minio
          command:
            - /bin/sh
            - -c
            - |
              set -e
              mc alias set local http://{{ include "agent-studio.fullname" . }}-minio:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD"
              mc mb --ignore-existing "local/{{ .Values.config.S3_BUCKET_NAME }}"
{{- end }}
