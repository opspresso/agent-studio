# Agent Studio and its MCP servers on the developer's own machine.
#
# The local twin of `deploy/idc/compose.yaml`, cut down to what a laptop needs:
# no caddy (the app publishes 3000 directly), no fixed subnet (there is no
# proxy hop to strip), and the app is *built from this working tree* rather
# than pulled — this is how the deployed shape of the current code is tested,
# `pnpm dev` stays the tool for code iteration.
#
# The MCP scheme is the IDC one, unchanged and for the same reason: the
# registry rows agent-plugins syncs name `http://mcp-<name>.agent-mcps.svc.
# cluster.local/mcp`, so every MCP service carries that **cluster DNS name as a
# network alias** and **listens on 80** (the URL has no port). The app reaches
# them only because `.env` declares MCP_INTERNAL_HOST_SUFFIXES past the SSRF
# guard.
#
# DynamoDB is *not* here: the app reaches the shared dev instance the root
# compose.yaml runs (`docker compose up -d dynamodb`, port 8083) through
# host.docker.internal, so this deployment reads the same table — and accepts
# the same dev-session cookies — as `pnpm dev`.

name: agent-studio-local

x-mcp: &mcp
  restart: unless-stopped
  logging: &logging
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

services:
  app:
    build: ../..
    ports:
      - "3000:3000"
    # Later files win: `.env.local` is the developer's ordinary dev config and
    # `.env` re-states only what looks different from inside a container
    # (loopback endpoints, the MCP suffix, the managed feature switched off).
    env_file:
      - ../../.env.local
      - .env
    # host-gateway also works on Docker Desktop/OrbStack, so the mapping is
    # portable rather than macOS-only.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # At least MAX_RUN_DURATION_MS (10 min) — same reasoning as IDC: SIGTERM
    # drains, and the grace period is the whole budget.
    stop_grace_period: 660s
    mem_limit: 1600m
    logging: *logging

  # --- MCP servers -------------------------------------------------------
  # The two that need no credentials — the default profile-less set, enough
  # for an end-to-end MCP run.

  mcp-document:
    <<: *mcp
    image: ${ECR_REGISTRY}/mcp-document:${MCP_DOCUMENT_TAG}
    environment:
      PORT: "80"
    mem_limit: 512m
    networks:
      default:
        aliases:
          - mcp-document.agent-mcps.svc.cluster.local

  mcp-youtube:
    <<: *mcp
    image: ${ECR_REGISTRY}/mcp-youtube:${MCP_YOUTUBE_TAG}
    environment:
      PORT: "80"
    mem_limit: 512m
    networks:
      default:
        aliases:
          - mcp-youtube.agent-mcps.svc.cluster.local

  # --- MCP servers that need real credentials ----------------------------
  # `aws` needs .env.aws (an access key); note that mcp-memory then reads and
  # writes the *same* memory buckets alpha uses — there is no local S3 Vectors.
  # `brave` needs BRAVE_API_KEY in `.env`.

  mcp-memory:
    <<: *mcp
    profiles: [aws]
    image: ${ECR_REGISTRY}/mcp-memory:${MCP_MEMORY_TAG}
    env_file:
      - .env.aws
    environment:
      PORT: "80"
      AWS_REGION: ${AWS_REGION:-ap-northeast-2}
      VECTOR_BUCKET: agent-studio-vector
      VECTOR_INDEX: memories
      STATE_BUCKET: agent-studio-memory
      EMBEDDING_PROVIDER: bedrock
      EMBEDDING_MODEL: amazon.titan-embed-text-v2:0
      EMBEDDING_DIM: "1024"
      RECALL_MIN_SIMILARITY: "0.1"
    mem_limit: 512m
    networks:
      default:
        aliases:
          - mcp-memory.agent-mcps.svc.cluster.local

  # Same launcher and healthcheck as IDC — see the long comments there for why
  # `entrypoint` (not `command`) and why the image's own HEALTHCHECK is
  # replaced.
  mcp-cloudwatch:
    <<: *mcp
    profiles: [aws]
    image: public.ecr.aws/awslabs-mcp/awslabs/cloudwatch-mcp-server:${MCP_CLOUDWATCH_TAG}
    env_file:
      - .env.aws
    environment:
      AWS_REGION: ${AWS_REGION:-ap-northeast-2}
    entrypoint:
      - python
      - -c
      - |
        from awslabs.cloudwatch_mcp_server.server import mcp
        from mcp.server.transport_security import TransportSecuritySettings
        mcp.settings.host = "0.0.0.0"
        mcp.settings.port = 80
        mcp.settings.stateless_http = True
        mcp.settings.json_response = True
        mcp.settings.transport_security = TransportSecuritySettings(
            enable_dns_rebinding_protection=True,
            allowed_hosts=[
                "mcp-cloudwatch.agent-mcps.svc.cluster.local",
                "mcp-cloudwatch.agent-mcps.svc.cluster.local:*",
                "localhost",
                "localhost:*",
                "127.0.0.1",
                "127.0.0.1:*",
            ],
        )
        mcp.run(transport="streamable-http")
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 80), 3).close()"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    mem_limit: 1g
    networks:
      default:
        aliases:
          - mcp-cloudwatch.agent-mcps.svc.cluster.local

  mcp-brave-search:
    <<: *mcp
    profiles: [brave]
    image: brave/brave-search-mcp-server:${MCP_BRAVE_TAG}
    env_file:
      - .env
    environment:
      BRAVE_MCP_TRANSPORT: http
      BRAVE_MCP_HOST: 0.0.0.0
      BRAVE_MCP_PORT: "80"
      BRAVE_MCP_STATELESS: "true"
    mem_limit: 512m
    networks:
      default:
        aliases:
          - mcp-brave-search.agent-mcps.svc.cluster.local

  # --- Ticker ------------------------------------------------------------
  # IDC's tick loop, mounted from there rather than copied: without it nothing
  # fires schedules, syncs plugins or reindexes the catalog locally. Needs
  # SCHEDULE_SCAN_TOKEN (usually already in .env.local).
  ticker:
    profiles: [ticker]
    image: curlimages/curl:8.11.1
    restart: unless-stopped
    env_file:
      - ../../.env.local
      - .env
    entrypoint: ["/bin/sh", "/tick.sh"]
    volumes:
      - ../idc/scripts/tick.sh:/tick.sh:ro
    depends_on:
      app:
        condition: service_healthy
    mem_limit: 64m
    logging: *logging
