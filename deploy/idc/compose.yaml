# Agent Studio on one host: the app, its database, its object store, and the
# MCP servers the registry names — the shape an on-premises install takes.
#
# Everything the app needs to run lives on this host: PostgreSQL (with
# pgvector) holds every row, MinIO holds what runs produce, and nothing leaves
# the network unless a profile says so. The `aws` profile adds the servers that
# talk to AWS (memory, CloudWatch) for a deployment that has an account; the
# `eks` profile adds the ones that look back at a cluster; `ticker` is the
# scheduler, and is on by default because nothing else fires schedules here.
#
# Two things make the MCP registry work unchanged. Every MCP service carries its
# **cluster DNS name as a network alias**, so `agent-plugins`' mcp.json — which
# names `http://mcp-<name>.agent-mcps.svc.cluster.local/mcp` — resolves here.
# And every one of them **listens on 80**, because that URL has no port. Neither
# is cosmetic: the app reaches those addresses only because
# MCP_INTERNAL_HOST_SUFFIXES declares that suffix past the SSRF guard, and
# mcp-grafana and mcp-cloudwatch additionally check the Host header against a
# list that already contains exactly this name without a port.

name: agent-studio

x-mcp: &mcp
  restart: unless-stopped
  logging: &logging
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

services:
  # TLS terminator. Caddy answers the ACME challenge on 80 and serves 443; the
  # certificate for the hostname in Caddyfile is issued on first boot. Inside a
  # network with no ACME reachability, point Caddyfile at a certificate the
  # organisation issues (see README).
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      app:
        condition: service_healthy
    logging: *logging

  app:
    image: ${IMAGE_REGISTRY}/agent-studio:${AGENT_STUDIO_TAG}
    restart: unless-stopped
    # Both generated by scripts/deploy.sh: .env carries the settings and the
    # app's secrets, .env.host the credentials this host minted for its own
    # database and object store. .env.aws, when the host has one, is the AWS
    # key the Bedrock channel and Cohere embeddings sign with — kept apart
    # from the object store's key below on purpose.
    env_file:
      - .env.host
      - .env
      - path: .env.aws
        required: false
    environment:
      DATABASE_URL: postgres://agent_studio:${POSTGRES_PASSWORD}@postgres:5432/agent_studio
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    # At least MAX_RUN_DURATION_MS (10 min). Anything shorter cuts SSE streams
    # that were about to finish — the app turns SIGTERM into draining and never
    # calls process.exit, so the runtime's grace period is the whole budget.
    stop_grace_period: 660s
    mem_limit: 1600m
    logging: *logging

  # --- Storage -------------------------------------------------------------
  # Not published: only the app reaches either, over the compose network.

  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: agent_studio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: agent_studio
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent_studio -d agent_studio"]
      interval: 10s
      timeout: 5s
      retries: 12
    # Past the checkpoint: a kill mid-write is a recovery on the next start,
    # not a loss, but a clean shutdown is cheaper.
    stop_grace_period: 60s
    mem_limit: 768m
    logging: *logging

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 12
    mem_limit: 512m
    logging: *logging

  # Creates the bucket on first start, then exits. Idempotent: `mc mb
  # --ignore-existing` is a no-op on every later run.
  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" &&
        mc mb --ignore-existing "local/$$S3_BUCKET_NAME"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME}
    logging: *logging

  # --- MCP servers -------------------------------------------------------
  # Containers get net.ipv4.ip_unprivileged_port_start=0, so the unprivileged
  # user each image runs as can bind 80.

  mcp-document:
    <<: *mcp
    image: ${IMAGE_REGISTRY}/mcp-document:${MCP_DOCUMENT_TAG}
    environment:
      PORT: "80"
    mem_limit: 512m
    networks:
      default:
        aliases:
          - mcp-document.agent-mcps.svc.cluster.local

  mcp-youtube:
    <<: *mcp
    image: ${IMAGE_REGISTRY}/mcp-youtube:${MCP_YOUTUBE_TAG}
    environment:
      PORT: "80"
    mem_limit: 512m
    networks:
      default:
        aliases:
          - mcp-youtube.agent-mcps.svc.cluster.local

  mcp-brave-search:
    <<: *mcp
    image: brave/brave-search-mcp-server:${MCP_BRAVE_TAG}
    env_file:
      - .env.mcp
    environment:
      BRAVE_MCP_TRANSPORT: http
      BRAVE_MCP_HOST: 0.0.0.0
      BRAVE_MCP_PORT: "80"
      BRAVE_MCP_STATELESS: "true"
    mem_limit: 512m
    networks:
      default:
        aliases:
          - mcp-brave-search.agent-mcps.svc.cluster.local

  # --- MCP servers that need an AWS account (profile `aws`) ---------------
  # mcp-memory keeps its memories in this host's PostgreSQL — a database of
  # its own beside the app's, created by `deploy/postgres/init.sql` on a first
  # boot (an existing volume needs it created by hand: `CREATE DATABASE
  # mcp_memory OWNER agent_studio`). What still needs AWS is the *embedder*:
  # the memories already written are Titan vectors, and pgvector refuses to
  # compare two models' output, so the key in .env.aws stays until a
  # deployment re-embeds against its own endpoint. mcp-cloudwatch reads
  # CloudWatch and takes the same key.

  mcp-memory:
    <<: *mcp
    image: ${IMAGE_REGISTRY}/mcp-memory:${MCP_MEMORY_TAG}
    env_file:
      - .env.aws
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: "80"
      AWS_REGION: ${AWS_REGION}
      DATABASE_URL: postgres://agent_studio:${POSTGRES_PASSWORD}@postgres:5432/mcp_memory
      # Titan, not the catalog's embedding: two indexes, each queried by the
      # model that wrote it.
      EMBEDDING_PROVIDER: bedrock
      EMBEDDING_MODEL: amazon.titan-embed-text-v2:0
      EMBEDDING_DIM: "1024"
      RECALL_MIN_SIMILARITY: "0.1"
      # Turns on search_docs, which queries a Bedrock Knowledge Base over
      # Retrieve. Shared by every project — memories stay per-tenant.
      KNOWLEDGE_BASE_ID: ${MEMORY_KNOWLEDGE_BASE_ID}
    mem_limit: 512m
    networks:
      default:
        aliases:
          - mcp-memory.agent-mcps.svc.cluster.local

  # AWS Labs' server, started through the same python -c launcher the chart
  # uses. `allowed_hosts` is DNS-rebinding protection and is matched exactly:
  # the entry without a port is the one a request to port 80 sends.
  #
  # `entrypoint`, not `command`, and the two are not interchangeable here: the
  # chart's `command:`/`args:` are Kubernetes' names for ENTRYPOINT and CMD,
  # while compose's `command:` replaces CMD alone. This image declares
  # ENTRYPOINT ["awslabs.cloudwatch-mcp-server"] and no CMD, so putting the
  # launcher in `command` runs `awslabs.cloudwatch-mcp-server python -c …` — the
  # stock server on stdio, which finds no stdin, exits 0, and restarts forever
  # while logging a healthy startup every time.
  mcp-cloudwatch:
    <<: *mcp
    profiles: [aws]
    image: public.ecr.aws/awslabs-mcp/awslabs/cloudwatch-mcp-server:${MCP_CLOUDWATCH_TAG}
    env_file:
      - .env.aws
    environment:
      AWS_REGION: ${AWS_REGION}
    entrypoint:
      - python
      - -c
      - |
        from awslabs.cloudwatch_mcp_server.server import mcp
        from mcp.server.transport_security import TransportSecuritySettings
        mcp.settings.host = "0.0.0.0"
        mcp.settings.port = 80
        mcp.settings.stateless_http = True
        mcp.settings.json_response = True
        mcp.settings.transport_security = TransportSecuritySettings(
            enable_dns_rebinding_protection=True,
            allowed_hosts=[
                "mcp-cloudwatch.agent-mcps.svc.cluster.local",
                "mcp-cloudwatch.agent-mcps.svc.cluster.local:*",
                "localhost",
                "localhost:*",
                "127.0.0.1",
                "127.0.0.1:*",
            ],
        )
        mcp.run(transport="streamable-http")
    # The image ships a HEALTHCHECK that exits 1 under this entrypoint, and
    # nothing in the cluster ever ran it: Kubernetes ignores a image's own
    # healthcheck and the chart probes the port instead. This is that probe —
    # a connect, which is all a stateless streamable-http server can promise
    # without a session.
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 80), 3).close()"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    mem_limit: 1g
    networks:
      default:
        aliases:
          - mcp-cloudwatch.agent-mcps.svc.cluster.local

  # --- MCP servers that look back at a cluster (profile `eks`) ------------
  # These three reach Argo CD, Grafana and the Kubernetes API. Each needs an
  # address that resolves from here and a credential to go with it, so they
  # stay behind a profile and start only once `eks` is added to
  # COMPOSE_PROFILES. Fill the addresses in .env.mcp.example first.

  mcp-argocd:
    <<: *mcp
    profiles: [eks]
    image: quay.io/argoprojlabs/mcp-for-argocd:${MCP_ARGOCD_TAG}
    env_file:
      - .env.mcp
    # The image declares `node dist/index.js` as its ENTRYPOINT, so `command`
    # starts with the transport. The server also binds loopback by default and
    # requires an explicit security choice when widened. This service has no
    # published port and is reachable only on the private Compose network, so
    # preserve that boundary explicitly.
    command: ["http", "--port", "80", "--stateless", "--bind-address", "0.0.0.0", "--allow-unauthenticated", "--allowed-host-header", "mcp-argocd.agent-mcps.svc.cluster.local", "--allowed-host-header", "mcp-argocd"]
    mem_limit: 256m
    networks:
      default:
        aliases:
          - mcp-argocd.agent-mcps.svc.cluster.local

  mcp-grafana:
    <<: *mcp
    profiles: [eks]
    image: grafana/mcp-grafana:${MCP_GRAFANA_TAG}
    env_file:
      - .env.mcp
    # --address is load-bearing: the default binds localhost inside the
    # container's own namespace, which no other container can reach.
    command:
      - "--transport"
      - "streamable-http"
      - "--address"
      - "0.0.0.0:80"
      - "--allowed-hosts"
      - "mcp-grafana.agent-mcps.svc.cluster.local,mcp-grafana,localhost"
    mem_limit: 256m
    networks:
      default:
        aliases:
          - mcp-grafana.agent-mcps.svc.cluster.local

  # Needs a kubeconfig: there is no in-cluster service account here. Mount one
  # that authenticates to the cluster's API and carries the same read-only
  # rights the chart's RBAC granted.
  mcp-kubernetes:
    <<: *mcp
    profiles: [eks]
    image: quay.io/containers/kubernetes_mcp_server:${MCP_KUBERNETES_TAG}
    volumes:
      - ./kubeconfig:/home/nonroot/.kube/config:ro
    environment:
      KUBECONFIG: /home/nonroot/.kube/config
    command: ["--port", "80", "--toolsets", "core", "--stateless"]
    mem_limit: 256m
    networks:
      default:
        aliases:
          - mcp-kubernetes.agent-mcps.svc.cluster.local

  # --- Tickers -----------------------------------------------------------
  # The scheduler, as one loop: schedules, plugins sync, the catalog reindex,
  # and — riding on the schedule tick — the retention sweep. Without it
  # **nothing ticks this host**: schedules do not fire, expired rows are never
  # purged, the catalog is never reindexed — which is why `.env.example` turns
  # it on (`COMPOSE_PROFILES=ticker`).
  ticker:
    profiles: [ticker]
    image: curlimages/curl:8.11.1
    restart: unless-stopped
    env_file:
      - .env
    entrypoint: ["/bin/sh", "/tick.sh"]
    volumes:
      - ./scripts/tick.sh:/tick.sh:ro
    depends_on:
      app:
        condition: service_healthy
    mem_limit: 64m
    logging: *logging

networks:
  default:
    ipam:
      config:
        # Fixed so TRUSTED_PROXY_CIDRS can name it: Better Auth strips these
        # hops off X-Forwarded-For to find the client IP it rate-limits by.
        - subnet: 172.31.240.0/24

volumes:
  caddy-data:
  caddy-config:
  postgres-data:
  minio-data:
