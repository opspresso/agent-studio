name: Release

on:
  push:
    tags: ["v*"]

permissions:
  id-token: write
  contents: read
  packages: write

# One build per tag.
concurrency:
  group: "release-${{ github.ref_name }}"
  cancel-in-progress: true

env:
  AWS_REGION: ap-northeast-2
  AWS_ROLE_ARN: arn:aws:iam::396608815058:role/github--agent-studio-ecr
  ECR_REPOSITORY: 396608815058.dkr.ecr.ap-northeast-2.amazonaws.com/agent-studio

# All jobs use GitHub-hosted Ubuntu runners, which support service containers.
jobs:
  verify:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg18-trixie
        env:
          POSTGRES_USER: agent_studio
          POSTGRES_PASSWORD: agent_studio
          POSTGRES_DB: agent_studio_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agent_studio -d agent_studio_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Runner self-updates can dereference the bundled npm symlink, so provide npm first.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:integration

  github-release:
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF_NAME}"
          prev="$(git describe --tags --abbrev=0 "${tag}^" 2>/dev/null || true)"
          if [ -n "$prev" ]; then
            notes="$(git log --no-merges --pretty='- %s' "${prev}..${tag}" | grep -v '^- chore: release' || true)"
          else
            notes="$(git log --no-merges --pretty='- %s' "${tag}" | grep -v '^- chore: release' || true)"
          fi
          gh release create "$tag" --title "$tag" --notes "$notes"

  release:
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      # GHCR as well: the pull path an installation outside this AWS account
      # uses, and the one a mirror into an air-gapped registry starts from.
      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          name: agent-studio
          keep-state: true

      # Attestations off. BuildKit adds a provenance attestation by default, and
      # an attestation is carried as an extra manifest inside an image index —
      # so even this single-platform build pushed an index plus two untagged
      # children (the amd64 image and a `platform: unknown` attestation). Every
      # release cost three ECR entries instead of one, and the two untagged ones
      # are what a tag points at, which makes the obvious "expire untagged"
      # lifecycle rule delete the image a released tag needs. Nothing here
      # consumes the provenance. See docs.docker.com/build/metadata/attestations.
      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: |
            ${{ env.ECR_REPOSITORY }}:${{ github.ref_name }}
            ${{ env.ECR_REPOSITORY }}:latest
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:latest

      - name: Build and push Workspace image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: sandbox
          file: sandbox/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: ghcr.io/${{ github.repository }}:workspace-${{ github.ref_name }}

  # Deployment manifests live in argocd-env-demo. This repository only sends
  # the image tag after the image exists; it does not own the target manifests.
  gitops:
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Mint a token for the GitOps repository
        id: gitops-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.GITOPS_CLIENT_ID }}
          private-key: ${{ secrets.GITOPS_PRIVATE_KEY }}
          owner: opspresso
          repositories: argocd-env-demo

      - name: Trigger GitOps 🚀
        env:
          GH_TOKEN: ${{ steps.gitops-token.outputs.token }}
        run: |
          gh api repos/opspresso/argocd-env-demo/dispatches \
            -f event_type=gitops \
            -f client_payload[username]=opspresso \
            -f client_payload[project]=agent-studio \
            -f client_payload[version]="${GITHUB_REF_NAME}" \
            -f client_payload[container]=app \
            -f client_payload[phase]=alpha \
            -f client_payload[type]=helm
