name: Release (ecr)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

# One build per tag.
concurrency:
  group: "release-${{ github.ref_name }}"
  cancel-in-progress: true

env:
  AWS_REGION: ap-northeast-2
  IMAGE: 396608815058.dkr.ecr.ap-northeast-2.amazonaws.com/agent-studio

# amd64 only: the sole deployment target (eks-demo) runs amd64 nodes, and the
# free arm64 hosted runners are not available on private repositories.
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.10.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test

  github-release:
    needs: verify
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF_NAME}"
          prev="$(git describe --tags --abbrev=0 "${tag}^" 2>/dev/null || true)"
          if [ -n "$prev" ]; then
            notes="$(git log --no-merges --pretty='- %s' "${prev}..${tag}" | grep -v '^- chore: release' || true)"
          else
            notes="$(git log --no-merges --pretty='- %s' "${tag}" | grep -v '^- chore: release' || true)"
          fi
          gh release create "$tag" --title "$tag" --notes "$notes"

  release:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::396608815058:role/github--agent-studio-ecr
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Attestations off. BuildKit adds a provenance attestation by default, and
      # an attestation is carried as an extra manifest inside an image index —
      # so even this single-platform build pushed an index plus two untagged
      # children (the amd64 image and a `platform: unknown` attestation). Every
      # release cost three ECR entries instead of one, and the two untagged ones
      # are what a tag points at, which makes the obvious "expire untagged"
      # lifecycle rule delete the image a released tag needs. Nothing here
      # consumes the provenance. See docs.docker.com/build/metadata/attestations.
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: |
            ${{ env.IMAGE }}:${{ github.ref_name }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # A repository_dispatch to another repository cannot use GITHUB_TOKEN: it
      # is scoped to the repository running the workflow. This mints a
      # short-lived installation token instead, scoped to argocd-env-demo alone,
      # so there is no long-lived PAT to rotate or over-scope.
      - name: Mint a token for the GitOps repository
        id: gitops-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.GITOPS_APP_ID }}
          private-key: ${{ secrets.GITOPS_APP_PRIVATE_KEY }}
          owner: opspresso
          repositories: argocd-env-demo

      # `phase: alpha` is the deployed one, not a staging step: the ApplicationSet
      # in apps/agent-studio.yaml loads values.yaml + values-alpha.yaml, and
      # nothing reads values-prod.yaml. `container: app` is the top-level key in
      # that values file — helm.py matches it by name to find the image tag.
      - name: Trigger GitOps 🚀
        env:
          GH_TOKEN: ${{ steps.gitops-token.outputs.token }}
        run: |
          gh api repos/opspresso/argocd-env-demo/dispatches \
            -f event_type=gitops \
            -f client_payload[username]=opspresso \
            -f client_payload[project]=agent-studio \
            -f client_payload[version]="${GITHUB_REF_NAME}" \
            -f client_payload[container]=app \
            -f client_payload[phase]=alpha \
            -f client_payload[type]=helm
