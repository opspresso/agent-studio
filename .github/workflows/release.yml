name: Release

on:
  push:
    tags: ["v*"]

permissions:
  id-token: write
  contents: read
  packages: write

# One build per tag.
concurrency:
  group: "release-${{ github.ref_name }}"
  cancel-in-progress: true

env:
  AWS_REGION: ap-northeast-2
  AWS_ROLE_ARN: arn:aws:iam::396608815058:role/github--agent-studio-ecr
  ECR_REPOSITORY: 396608815058.dkr.ecr.ap-northeast-2.amazonaws.com/agent-studio

# Release jobs use a persistent self-hosted Linux runner with Docker support.
jobs:
  verify:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: [self-hosted, linux]
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg18-trixie
        env:
          POSTGRES_USER: agent_studio
          POSTGRES_PASSWORD: agent_studio
          POSTGRES_DB: agent_studio_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agent_studio -d agent_studio_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      # Runner self-updates can dereference the bundled npm symlink, so provide npm first.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - uses: pnpm/action-setup@v6
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:integration

  github-release:
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: [self-hosted, linux]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF_NAME}"
          prev="$(git describe --tags --abbrev=0 "${tag}^" 2>/dev/null || true)"
          if [ -n "$prev" ]; then
            notes="$(git log --no-merges --pretty='- %s' "${prev}..${tag}" | grep -v '^- chore: release' || true)"
          else
            notes="$(git log --no-merges --pretty='- %s' "${tag}" | grep -v '^- chore: release' || true)"
          fi
          gh release create "$tag" --title "$tag" --notes "$notes"

  release:
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: [self-hosted, linux]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      # GHCR as well: the pull path an installation outside this AWS account
      # uses, and the one a mirror into an air-gapped registry starts from.
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          name: agent-studio
          keep-state: true

      # Attestations off. BuildKit adds a provenance attestation by default, and
      # an attestation is carried as an extra manifest inside an image index.
      # That creates untagged ECR children, which makes the obvious "expire
      # untagged" lifecycle rule delete image manifests a released tag needs.
      # Nothing here consumes the provenance. See
      # docs.docker.com/build/metadata/attestations.
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          sbom: false
          tags: |
            ${{ env.ECR_REPOSITORY }}:${{ github.ref_name }}
            ${{ env.ECR_REPOSITORY }}:latest
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:latest

      - name: Build and push Workspace image
        uses: docker/build-push-action@v7
        with:
          context: sandbox
          file: sandbox/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          sbom: false
          tags: |
            ${{ env.ECR_REPOSITORY }}:workspace-${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:workspace-${{ github.ref_name }}

  # Deployment manifests live in argocd-env-demo. This repository only sends
  # the image tag after the image exists; it does not own the target manifests.
  gitops:
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: [self-hosted, linux]
    timeout-minutes: 5
    # No OIDC here — the only credential is the app installation token below.
    permissions:
      contents: read
    steps:
      # A repository_dispatch to another repository cannot use GITHUB_TOKEN: it
      # is scoped to the repository running the workflow. This mints a
      # short-lived installation token instead, scoped to argocd-env-demo alone,
      # so there is no long-lived PAT to rotate or over-scope.
      #
      # The JWT timestamps come from GitHub's own Date header, not the runner
      # clock: actions/create-github-app-token signs with local time, and a
      # self-hosted runner drifting ahead makes GitHub reject the token with
      # "'exp' is too far in the future".
      - name: Mint a token for the GitOps repository
        id: gitops-token
        env:
          CLIENT_ID: ${{ vars.GITOPS_CLIENT_ID }}
          PRIVATE_KEY: ${{ secrets.GITOPS_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          b64url() { openssl base64 -A | tr '+/' '-_' | tr -d '='; }
          github_date=$(curl -fsSI https://api.github.com/ | tr -d '\r' \
            | awk -F': ' 'tolower($1)=="date"{print $2}')
          github_now=$(date -u -d "$github_date" +%s)
          header=$(printf '{"alg":"RS256","typ":"JWT"}' | b64url)
          payload=$(printf '{"iat":%d,"exp":%d,"iss":"%s"}' \
            "$((github_now - 60))" "$((github_now + 540))" "$CLIENT_ID" | b64url)
          signature=$(printf '%s.%s' "$header" "$payload" \
            | openssl dgst -sha256 -sign <(printf '%s' "$PRIVATE_KEY") -binary \
            | b64url)
          jwt="$header.$payload.$signature"
          installation_id=$(curl -fsS \
            -H "Authorization: Bearer $jwt" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/opspresso/argocd-env-demo/installation \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')
          token=$(curl -fsS -X POST \
            -H "Authorization: Bearer $jwt" \
            -H "Accept: application/vnd.github+json" \
            -d '{"repositories":["argocd-env-demo"]}' \
            "https://api.github.com/app/installations/${installation_id}/access_tokens" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["token"])')
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Trigger GitOps 🚀
        env:
          GH_TOKEN: ${{ steps.gitops-token.outputs.token }}
        run: |
          gh api repos/opspresso/argocd-env-demo/dispatches \
            -f event_type=gitops \
            -f client_payload[username]=opspresso \
            -f client_payload[project]=agent-studio \
            -f client_payload[version]="${GITHUB_REF_NAME}" \
            -f client_payload[container]=app \
            -f client_payload[phase]=alpha \
            -f client_payload[type]=helm
