name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      # `services:` cannot pass command arguments, so the compose flags are
      # absent here — and neither is needed: a fresh container per job is already
      # empty (-inMemory), and one job holds a single credential and region, so
      # there is no second DB to split off (-sharedDb). The host port must be
      # 8084, which is what the integration check connects to.
      dynamodb:
        image: amazon/dynamodb-local:3.3.0
        ports:
          - 8084:8000
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11.10.0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      # Both scripts carry the test endpoint and table themselves, so there is
      # nothing to set here — and nothing to keep in step with them.
      - name: Integration tests
        run: |
          pnpm init-local-table:test
          pnpm test:integration

      - name: Build
        run: pnpm build
