name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: self-hosted
    services:
      # A fresh database per job. The name ends in `_test`, which is what the
      # integration check insists on before it writes and cascade-deletes; the
      # check applies the schema itself.
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: agent_studio
          POSTGRES_PASSWORD: agent_studio
          POSTGRES_DB: agent_studio_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agent_studio -d agent_studio_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      # The script carries the test database URL itself, so there is nothing
      # to set here — and nothing to keep in step with it.
      - name: Integration tests
        run: pnpm test:integration

      - name: Build
        run: pnpm build
