name: CI

on:
  push:
    branches: ["**"]

permissions:
  contents: read

jobs:
  verify:
    # Branch code runs on a disposable GitHub-hosted worker.
    runs-on: ubuntu-latest
    services:
      # A fresh database per job. The name ends in `_test`, which is what the
      # integration check insists on before it writes and cascade-deletes; the
      # check applies the schema itself.
      postgres:
        image: pgvector/pgvector:0.8.6-pg18-trixie
        env:
          POSTGRES_USER: agent_studio
          POSTGRES_PASSWORD: agent_studio
          POSTGRES_DB: agent_studio_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agent_studio -d agent_studio_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      # The script carries the test database URL itself, so there is nothing
      # to set here — and nothing to keep in step with it.
      - name: Integration tests
        run: pnpm test:integration

      - name: Build
        run: pnpm build

      - name: Isolate standalone deployment
        run: |
          document_smoke_dir=$(mktemp -d)
          cp -R .next/standalone/. "$document_smoke_dir/"
          mkdir -p "$document_smoke_dir/.next/static" "$document_smoke_dir/public"
          cp -R .next/static/. "$document_smoke_dir/.next/static/"
          cp -R public/. "$document_smoke_dir/public/"
          echo "DOCUMENT_SMOKE_DIR=$document_smoke_dir" >> "$GITHUB_ENV"

      - name: Native document worker smoke test
        working-directory: ${{ env.DOCUMENT_SMOKE_DIR }}
        run: '"$GITHUB_WORKSPACE/node_modules/.bin/tsx" --tsconfig "$GITHUB_WORKSPACE/tsconfig.json" "$GITHUB_WORKSPACE/scripts/document-worker-check.ts"'

      - name: Production server smoke test
        working-directory: ${{ env.DOCUMENT_SMOKE_DIR }}
        env:
          STAGE: local
          DATABASE_URL: postgres://agent_studio:agent_studio@localhost:5432/agent_studio_test
          LLM_BASE_URL: http://127.0.0.1:9/v1
          LLM_API_KEY: test
          AES_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          BETTER_AUTH_SECRET: ci-smoke-test-secret-32-bytes!!!
          BETTER_AUTH_URL: http://127.0.0.1:3000
          HOSTNAME: 127.0.0.1
          PORT: 3000
        run: |
          node server.js > /tmp/agent-studio-production.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:3000/api/health > /dev/null; then
              curl --fail --silent --show-error http://127.0.0.1:3000/ > /dev/null
              curl --fail --silent --show-error http://127.0.0.1:3000/logo.png > /dev/null
              static_asset=$(find .next/static -type f -name '*.js' -print -quit)
              static_url="/_next${static_asset#.next}"
              curl --fail --silent --show-error "http://127.0.0.1:3000${static_url}" > /dev/null
              sleep 1
              if ! kill -0 "$server_pid" 2>/dev/null || grep -q "unhandledRejection" /tmp/agent-studio-production.log; then
                cat /tmp/agent-studio-production.log
                exit 1
              fi
              exit 0
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat /tmp/agent-studio-production.log
              exit 1
            fi
            sleep 1
          done
          cat /tmp/agent-studio-production.log
          exit 1

  html-preview:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          package-manager-cache: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:html-preview
