name: CI

on:
  push:
    branches: ["**"]

permissions:
  contents: read

jobs:
  verify:
    # Only base-repository pushes trigger this persistent runner. Fork pull
    # requests need a separate ephemeral runner before their code can run.
    runs-on: [self-hosted, linux]
    services:
      # A fresh database per job. The name ends in `_test`, which is what the
      # integration check insists on before it writes and cascade-deletes; the
      # check applies the schema itself.
      postgres:
        image: pgvector/pgvector:0.8.6-pg18-trixie
        env:
          POSTGRES_USER: agent_studio
          POSTGRES_PASSWORD: agent_studio
          POSTGRES_DB: agent_studio_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agent_studio -d agent_studio_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      # The script carries the test database URL itself, so there is nothing
      # to set here — and nothing to keep in step with it.
      - name: Integration tests
        run: pnpm test:integration

      - name: Build
        run: pnpm build
