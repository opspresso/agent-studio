name: Check models

# Diffs the model registry against what every configured channel actually
# serves (`scripts/check-models.ts`). Scheduled rather than part of `verify`:
# it needs live provider APIs and real credentials, so a provider outage or a
# fork without secrets must not fail pull requests. `--strict --since=7d` is
# the one form with a meaningful exit code (docs/DEVELOPMENT.md).
#
# Requires repository/organization secrets: LLM_BASE_URL, LLM_API_KEY,
# SLACK_WEBHOOK_URL.

on:
  schedule:
    # Mondays 00:00 UTC — after a weekend of provider releases, before the week's work.
    - cron: "0 0 * * 1"
  workflow_dispatch:

jobs:
  check-models:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11.10.0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check model registry against served models
        id: models
        env:
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: |
          set +e
          pnpm check-models --strict --since=7d 2>&1 | tee model-check.log
          status=${PIPESTATUS[0]}
          echo "status=${status}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Notify Slack about model changes
        if: steps.models.outputs.status != '0'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          summary=$(tail -n 40 model-check.log)
          payload=$(jq -n \
            --arg text "Model registry changes or channel failures were detected.\n\n${summary}\n\n${RUN_URL}" \
            '{text: $text}')
          curl --fail --silent --show-error \
            -H 'Content-Type: application/json' \
            --data "$payload" \
            "$SLACK_WEBHOOK_URL"

      - name: Fail when model drift was detected
        if: steps.models.outputs.status != '0'
        run: exit 1
