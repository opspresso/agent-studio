name: Check models

# Diffs the model registry against what every configured channel actually
# serves (`scripts/check-models.ts`). Scheduled rather than part of `verify`:
# it needs live provider APIs and real credentials, so a provider outage or a
# fork without secrets must not fail pull requests. `--strict` is the form with
# a meaningful exit code; `--since=7d` only narrows the report (docs/DEVELOPMENT.md).
#
# The channels have to be the deployment's channels. With `LLM_BASE_URL` alone
# this job compared the registry against a single provider-direct endpoint,
# which serves bare ids — nothing matched, and every registered model was
# reported as retired. So the five provider channels of
# `argocd-env-demo/charts/agent-studio` are configured here too, Bedrock included:
# it signs with SigV4, hence the OIDC role rather than a key.
#
# Requires repository/organization secrets: LLM_BASE_URL, LLM_API_KEY,
# LLM_PROVIDER_OPENAI_API_KEY, LLM_PROVIDER_ANTHROPIC_API_KEY,
# LLM_PROVIDER_XAI_API_KEY, LLM_PROVIDER_OPENROUTER_API_KEY, SLACK_WEBHOOK_URL.

on:
  schedule:
    # Weekdays 08:00 KST (Sunday–Thursday 23:00 UTC).
    - cron: "0 23 * * 0-4"

permissions:
  id-token: write
  contents: read

env:
  # Where Bedrock's OpenAI-compatible host lives. The signer reads the region off
  # the URL, so this one only has to be a region the role can be assumed in.
  AWS_REGION: us-east-1
  AWS_ROLE_ARN: arn:aws:iam::396608815058:role/github--agent-studio-models

jobs:
  check-models:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Check model registry against served models
        id: models
        env:
          # Base URLs are configuration, not secrets — they are the same values
          # the chart carries in plain text. Only the keys are hidden.
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_PROVIDER_OPENAI_BASE_URL: https://api.openai.com/v1
          LLM_PROVIDER_OPENAI_API_KEY: ${{ secrets.LLM_PROVIDER_OPENAI_API_KEY }}
          LLM_PROVIDER_ANTHROPIC_BASE_URL: https://api.anthropic.com/v1
          LLM_PROVIDER_ANTHROPIC_API_KEY: ${{ secrets.LLM_PROVIDER_ANTHROPIC_API_KEY }}
          LLM_PROVIDER_XAI_BASE_URL: https://api.x.ai/v1
          LLM_PROVIDER_XAI_API_KEY: ${{ secrets.LLM_PROVIDER_XAI_API_KEY }}
          LLM_PROVIDER_OPENROUTER_BASE_URL: https://openrouter.ai/api/v1
          LLM_PROVIDER_OPENROUTER_API_KEY: ${{ secrets.LLM_PROVIDER_OPENROUTER_API_KEY }}
          # No key: the role assumed above is what signs this channel.
          LLM_PROVIDER_BEDROCK_BASE_URL: https://bedrock-mantle.us-east-1.api.aws/v1
          LLM_PROVIDER_BEDROCK_AUTH: sigv4
        run: |
          set +e
          pnpm check-models --strict --since=7d 2>&1 | tee model-check.log
          status=${PIPESTATUS[0]}
          echo "status=${status}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Notify Slack about model changes
        if: steps.models.outputs.status != '0'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          summary=$(tail -n 40 model-check.log)
          payload=$(jq -n \
            --arg text "Model registry changes or channel failures were detected.\n\n${summary}\n\n${RUN_URL}" \
            '{text: $text}')
          curl --fail --silent --show-error \
            -H 'Content-Type: application/json' \
            --data "$payload" \
            "$SLACK_WEBHOOK_URL"

      - name: Fail when model drift was detected
        if: steps.models.outputs.status != '0'
        run: exit 1
