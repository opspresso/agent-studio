services:
  app:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - .env.local
    environment:
      # Inside the compose network the local DynamoDB is reachable by service name.
      DYNAMODB_ENDPOINT_URL: http://dynamodb-local:8000
    depends_on:
      - dynamodb-local
    restart: unless-stopped

  # Development instance — what `pnpm dev` and `pnpm init-local-table` talk to.
  # -sharedDb + -dbPath + the volume keep tables and sessions across restarts.
  # user: root because Docker creates the mount point root-owned while the image
  # runs as uid 1000, which fails silently — the container shows Up but SQLite
  # can't open its file and clients hang.
  dynamodb-local:
    image: amazon/dynamodb-local:3.3.0
    user: root
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-dbPath", "./data"]
    working_dir: /home/dynamodblocal
    volumes:
      - dynamodb-data:/home/dynamodblocal/data
    ports:
      - "8085:8000"
    restart: unless-stopped

  # Integration-test instance, kept separate so `pnpm test:integration` — which
  # writes and cascade-deletes — can never touch data the dev app is using. The
  # image's default command is `-inMemory`, so every start is empty and
  # `pnpm init-local-table` has to recreate the table.
  dynamodb-local-test:
    image: amazon/dynamodb-local:3.3.0
    ports:
      - "8086:8000"
    restart: unless-stopped

volumes:
  dynamodb-data:
