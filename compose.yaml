# Agent Studio owns this local stack. Agent Memory uses its own project, ports,
# network and volumes, so either repository can start and stop independently.
# `down -v` still deletes this project's development data and requires care.
name: agent-studio-local

services:
  app:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - .env.local
    environment:
      # Inside the compose network the database is reachable by service name.
      DATABASE_URL: postgres://agent_studio:agent_studio@postgres:5432/agent_studio
      S3_BUCKET_NAME: agent-studio
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY_ID: agent_studio
      S3_SECRET_ACCESS_KEY: agent_studio_secret
      ARTIFACT_ACCESS_MODE: proxied
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    restart: unless-stopped

  # PostgreSQL with the pgvector extension — the one store this app needs. The
  # image is the upstream postgres image plus the extension, so anything an
  # install would run (RDS, a managed Postgres, a bare server with pgvector
  # installed) behaves the same.
  postgres:
    image: pgvector/pgvector:0.8.6-pg18-trixie
    environment:
      POSTGRES_USER: agent_studio
      POSTGRES_PASSWORD: agent_studio
      POSTGRES_DB: agent_studio
    volumes:
      - postgres18-data:/var/lib/postgresql
      - ./deploy/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent_studio -d agent_studio"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # The Agent Studio local S3-compatible object store.
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: agent_studio
      MINIO_ROOT_PASSWORD: agent_studio_secret
    volumes:
      - minio-data:/data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" &&
        mc mb --ignore-existing "local/$$S3_BUCKET_NAME"
    environment:
      MINIO_ROOT_USER: agent_studio
      MINIO_ROOT_PASSWORD: agent_studio_secret
      S3_BUCKET_NAME: agent-studio

volumes:
  postgres18-data:
  minio-data:
