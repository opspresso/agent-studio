# The PostgreSQL container is shared with every other project on this machine,
# so the compose project name is fixed here instead of being derived from the
# directory. Another repository running `docker compose up -d postgres` finds it
# already up and leaves it alone — as long as its service block is identical to
# this one. Database names, not ports, keep the projects apart: this app uses
# `agent_studio` for development and `agent_studio_test` for the integration
# check. `deploy/postgres/init.sql` creates them only when *this* repository is
# the one that initialises the volume; a repository that comes second creates
# its own role and databases itself (initdb never runs again), and the block
# stays word-for-word the same so compose does not recreate the container.
#
# Never `docker compose down -v` here: the volume belongs to every project. Nor
# `--remove-orphans`, which would take out containers another repository started.
name: localdev

services:
  app:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - .env.local
    environment:
      # Inside the compose network the database is reachable by service name.
      DATABASE_URL: postgres://agent_studio:agent_studio@postgres:5432/agent_studio
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # PostgreSQL with the pgvector extension — the one store this app needs. The
  # image is the upstream postgres image plus the extension, so anything an
  # install would run (RDS, a managed Postgres, a bare server with pgvector
  # installed) behaves the same.
  postgres:
    image: pgvector/pgvector:0.8.6-pg18-trixie
    environment:
      POSTGRES_USER: agent_studio
      POSTGRES_PASSWORD: agent_studio
      POSTGRES_DB: agent_studio
    volumes:
      - postgres18-data:/var/lib/postgresql
      - ./deploy/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent_studio -d agent_studio"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # An S3-compatible object store for what runs produce (images, documents).
  # Optional — artifact persistence is off without `S3_BUCKET_NAME` — and under
  # a profile so `docker compose up -d postgres` alone stays the minimum.
  #   docker compose --profile objects up -d
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    profiles: ["objects"]
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: agent_studio
      MINIO_ROOT_PASSWORD: agent_studio_secret
    volumes:
      - minio-data:/data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  postgres18-data:
  minio-data:
